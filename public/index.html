<style>
/* ---------- トークン ---------------------------------------------------
   配色はアルセチカさんの個人ブログ（aruseee.wordpress.com）の

   ---------------------------------------------------------------------- */
:root{

  --sky-mid:    #89b3c0;

*,*::before,*::after{ box-sizing:border-box; }

a{ color:inherit; }

:focus-visible{

}

}

.social a{

/* Simple Icons は塗り、Lucide は線画。同じ大きさで並ぶよう分けて指定します */

/* ---------- セクション見出し ------------------------------------------ */
.section{ padding-block:clamp(30px, 5vw, 46px) 0; }
.section:last-of-type{ padding-bottom:clamp(40px, 6vw, 64px); }

.section__head{

/* ---------- 配信ランプ（いま配信中） ----------------------------------- */
.lamp{

}

.frame{
  position:relative;
  margin-top:16px;
  aspect-ratio:16/9;

.lamp--on .btn{ margin-top:16px; }

/* ---------- 検索 -------------------------------------------------------- */
.finder{ margin-left:auto; }
.finder input{
  font-family:var(--body);
  font-size:.86rem;
  color:var(--ink);
  padding:7px 15px;

  border:1px solid #cfe1e7;

}
.finder input::placeholder{ color:#93a8ae; }

/* ---------- 過去の配信カード -------------------------------------------- */
.grid{

  gap:var(--gap);

  list-style:none;
}

.card{
  display:flex;
  flex-direction:column;
  height:100%;
  text-decoration:none;
  background:var(--panel);
  border:1px solid #dfeaee;
  border-radius:var(--radius);
  /* overflow は切りません。概要欄の全文をカードの下まで重ねて出すためです。
     角の丸みはサムネイルのほうで付けています */
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover{
  transform:translateY(-3px);
  border-color:var(--sky-mid);
  box-shadow:0 16px 28px -22px rgba(32,49,55,.6);
}
/* マウスを載せているカードを、となりや下の段のカードより手前に出します
   （概要欄の全文が下の段に重なったとき、下に潜らないように） */
.grid > li{ position:relative; }
.grid > li:hover,
.grid > li:focus-within{ z-index:2; }

.card__thumb{
  position:relative;
  aspect-ratio:16/9;
  background:var(--sky-soft);
  overflow:hidden;
  /* カードの枠線(1px)の内側に収まる丸み */
  border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
}
.card__thumb img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
}
/* サムネイルをどうしても読み込めなかったときの代替表示 */
.card__ph{
  position:absolute; inset:0;
  display:flex;

.card__body{

.card__title{

  font-weight:500;
  font-size:.97rem;
  line-height:1.55;

}
/* 日付・長さ・公開範囲のタグ。カードの一番下にそろえます。
   入りきらないときはタグ単位で次の行に回ります */
.card__meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:auto;
}
.card__tag{
  display:inline-flex;
  align-items:center;
  padding:2px 7px;
  font-family:var(--mono);
  font-size:.66rem;
  line-height:1.6;
  color:var(--sky-deep);

  border:1px solid transparent;
  border-radius:999px;
  white-space:nowrap;
}
/* 公開範囲は日付や長さとは性質が違うので、塗らずに枠線だけにします */
.card__tag--availability{

  border-color:var(--sky-mid);
}
/* メモは長いこともあるので、タグの中で折り返せるようにします */
.card__tag--note{

}

/* 概要欄。ふだんは最初の3行だけ出し、マウスを載せると全文を上に重ねて出します。
   全文のほう（__full）は見た目のための複製で、読み上げは __short の全文で済ませます。
   3行に収まっている概要欄は is-clamped が付かず、全文も出しません */
.card__desc{
  position:relative;
  font-size:.76rem;
  line-height:1.7;
  color:var(--ink-soft);
}
.card__desc-short,
.card__desc-full{
  margin:0;
  white-space:pre-wrap;

}
.card__desc-short{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
}
.card__desc-full{
  position:absolute;
  /* 内側の余白ぶん外に広げて、文字の位置を __short とぴったり重ねます */
  top:-8px; left:-10px; right:-10px;
  padding:8px 10px;
  max-height:min(60vh, 28em);
  overflow-y:auto;
  overscroll-behavior:contain;
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--sky-mid);
  border-radius:10px;
  box-shadow:0 18px 34px -18px rgba(32,49,55,.55);
  opacity:0;
  visibility:hidden;
  transition:opacity .14s ease, visibility .14s;
}
@media (hover:hover){
  .card__desc.is-clamped:hover .card__desc-full{ opacity:1; visibility:visible; }
}
/* キーボードでカードを選んだときも全文を出します */
.card:focus-visible .card__desc.is-clamped .card__desc-full{ opacity:1; visibility:visible; }

.empty{

/* ---------- フッター ----------------------------------------------------- */
.footer{

}
.footer__inner{ padding-block:26px 34px; }

.footer p:last-child{ margin-bottom:0; }
.footer a{ color:var(--sky-deep); }

/* 連絡先。取り下げの依頼や、ここにないアーカイブの情報をもらう窓口です */
.footer__contact{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px 14px;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #dbe8ec;
}
.footer__contact p{ margin:0; }

/* 画面が広いとき、「いまの配信」を2段組にします。
   1列のままだと、横幅いっぱいのプレイヤーが16:9で縦にも伸びて、
   PCでは画面を埋めるほど大きくなってしまうためです。
   左にタイトル・経過時間・ボタン、右にプレイヤーを置きます。

   HTMLの並び（配信中→タイトル→経過時間→プレイヤー→ボタン）は
   変えずに、置き場所だけ指定しています。狭い画面ではこの指定が効かず、
   そのままの縦並びになります。 */
@media (min-width:800px){
  .lamp--on{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);
    grid-template-rows:auto auto auto 1fr;
    column-gap:clamp(20px, 3vw, 34px);
    align-items:start;
  }
  /* グリッドの子は display が block 側に置き換わるので、
     「配信中」のピルとボタンには justify-self:start が要ります。
     付けないと、文字の幅ではなく列の幅まで横に伸びてしまいます。 */
  .lamp--on .lamp__tag  { grid-area:1 / 1; justify-self:start; }
  .lamp--on .lamp__title{ grid-area:2 / 1; }
  .lamp--on .lamp__note { grid-area:3 / 1; }
  .lamp--on .btn        { grid-area:4 / 1; align-self:start; justify-self:start; }
  /* プレイヤーは右の列で、左の内容の高さぶん全部にまたがらせます */
  .lamp--on .frame{
    grid-area:1 / 2 / -1 / 3;
    margin-top:0;
    align-self:start;
  }
}

@media (max-width:560px){
  .masthead__inner{ align-items:flex-start; }
  .finder{ margin-left:0; width:100%; }
  .finder input{ width:100%; }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

<script>
(function () {
  "use strict";

  /* YouTubeのURLから動画IDを取り出す（watch / youtu.be / live / embed 対応） */
  function videoIdOf(url) {
    if (!url) return "";
    try {
      var u = new URL(url);
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      var m = u.pathname.match(/\/(?:live|embed|shorts|v)\/([\w-]{6,})/);
      if (m) return m[1];
      if (u.hostname.indexOf("youtu.be") !== -1) return u.pathname.slice(1).split("/")[0];
    } catch (e) { /* URLが壊れていたら空で返す */ }
    return "";
  }

  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d)) return s;
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  /* 秒を「1時間20分」「30分」「1分未満」の形にします（秒は切り捨て） */
  function fmtDuration(sec) {
    if (typeof sec !== "number" || !(sec >= 0)) return "";
    var min = Math.floor(sec / 60);
    if (min < 1) return "1分未満";
    var h = Math.floor(min / 60);
    var m = min % 60;
    if (!h) return m + "分";
    return m ? h + "時間" + m + "分" : h + "時間";
  }

  /* YouTube の公開範囲（yt-dlp の availability）の表示名。
     書いていないものは、これまでどおり「限定公開」として扱います */
  var AVAILABILITY_LABELS = {
    "public":          "公開",
    "unlisted":        "限定公開",
    "private":         "非公開",
    "subscriber_only": "メンバー限定",
    "premium_only":    "Premium限定",
    "needs_auth":      "要ログイン"
  };
  function availabilityLabel(v) {
    if (!v) return "限定公開";
    return AVAILABILITY_LABELS.hasOwnProperty(v) ? AVAILABILITY_LABELS[v] : "";
  }

  var el = function (id) { return document.getElementById(id); };

  /* ---- ヘッダー ---- */
  document.title = SITE.title;
  el("siteTitle").textContent = SITE.title;
  el("siteSub").textContent = SITE.subtitle;

  /* ICONS の図形から <svg> をひとつ作ります。SVG は普通の HTML とは
     名前空間が違うので、createElement ではなく createElementNS を使います
     （createElement で作ると画面に何も出ません）。 */
  var SVG_NS = "http://www.w3.org/2000/svg";
  function makeIcon(name) {
    var icon = ICONS[name];
    if (!icon) return null;
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("data-style", icon.style);
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    icon.paths.forEach(function (d) {
      var path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
    });
    return svg;
  }

  var social = el("socialLinks");
  (SITE.links || []).forEach(function (link) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    /* 読み上げソフト用の名前と、マウスを乗せたときの吹き出し */
    a.setAttribute("aria-label", link.label);
    a.title = link.label;

    var icon = makeIcon(link.icon);
    if (icon) { a.appendChild(icon); }
    else      { a.textContent = link.label; }  /* 名前を間違えても迷子にしない */

    li.appendChild(a);
    social.appendChild(li);
  });

  /* ---- いまの配信 ----
     renderLive() は何度呼んでもよい形にしてあります。最初は SITE.live の値で
     描き、そのあと /live-now の答えが返ってきたら描き直します。 */
  var slot = el("liveSlot");
  var brandLamp = el("brandLamp");
  var liveId = "";        /* いま「配信中」として出している動画ID。無ければ "" */
  var liveNoteEl = null;  /* 枠の下のひとこと。あとから書き足せるように持っておく */

  function elapsedText(iso) {
    if (!iso) return "";
    var start = Date.parse(iso);
    if (!isFinite(start)) return "";
    var min = Math.floor((Date.now() - start) / 60000);
    if (min < 0) return "";
    if (min < 60) return "配信開始から" + min + "分";
    return "配信開始から" + Math.floor(min / 60) + "時間" + (min % 60) + "分";
  }

  /* live は { title, url, note?, startedAt? } か null。null なら消灯表示 */
  function renderLive(live) {
    liveId = live ? videoIdOf(live.url) : "";
    liveNoteEl = null;
    brandLamp.setAttribute("data-on", liveId ? "true" : "false");

    while (slot.firstChild) { slot.removeChild(slot.firstChild); }

    if (liveId) {
      var on = document.createElement("div");
      on.className = "lamp lamp--on";

      var tag = document.createElement("span");
      tag.className = "lamp__tag";
      tag.textContent = "配信中";
      on.appendChild(tag);

      var h = document.createElement("p");
      h.className = "lamp__title";
      h.textContent = live.title || "配信中";
      on.appendChild(h);

      var noteText = live.note || elapsedText(live.startedAt);
      liveNoteEl = document.createElement("p");
      liveNoteEl.className = "lamp__note";
      liveNoteEl.textContent = noteText;
      liveNoteEl.hidden = !noteText;
      on.appendChild(liveNoteEl);

      var frame = document.createElement("div");
      frame.className = "frame";
      var iframe = document.createElement("iframe");
      iframe.src = "https://www.youtube-nocookie.com/embed/" + liveId;
      iframe.title = live.title || "配信";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture";
      iframe.allowFullscreen = true;
      iframe.loading = "lazy";
      /* このサイトは _headers で Referrer-Policy: no-referrer をかけているため、
         そのままだとプレイヤーに参照元がまったく届かず、YouTube側が
         「動画プレイヤーの設定エラー（エラー153）」を出します。
         埋め込みだけは、ドメインだけを伝える指定に上書きします
         （送るのは https://＜このサイト＞/ までで、ページのパスは送りません）。
         サムネイル画像は下で画像ごとに no-referrer を明示しているので、
         ここを緩めても影響しません。 */
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      frame.appendChild(iframe);
      on.appendChild(frame);

      var go = document.createElement("a");
      go.className = "btn";
      go.href = live.url;
      go.target = "_blank";
      go.rel = "noopener noreferrer";
      go.textContent = "YouTubeで見る";
      on.appendChild(go);

      slot.appendChild(on);
    } else {
      var off = document.createElement("div");
      off.className = "lamp lamp--off";

      var msg = document.createElement("p");
      msg.className = "lamp__msg";
      var strong = document.createElement("strong");
      strong.textContent = "いまは配信していません";
      msg.appendChild(strong);
      msg.appendChild(document.createTextNode(
        "配信が始まったらここに枠が出ます。"
      ));
      off.appendChild(msg);

      var ch = document.createElement("a");
      ch.className = "btn";
      ch.href = SITE.channelUrl;
      ch.target = "_blank";
      ch.rel = "noopener noreferrer";
      ch.textContent = "チャンネルを見に行く";
      off.appendChild(ch);

      slot.appendChild(off);
    }

    applyFilter();
  }

  /* すでに出ている枠に、ひとことだけ足します（プレイヤーは作り直しません）。
     手で書いたメモがあるときは触りません */
  function updateLiveNote(startedAt) {
    if (!liveNoteEl || liveNoteEl.textContent) return;
    var text = elapsedText(startedAt);
    if (!text) return;
    liveNoteEl.textContent = text;
    liveNoteEl.hidden = false;
  }

  /* ---- 過去の配信 ----
     配信中の動画は「過去の配信」からは隠します（同じ配信が二重に出ないように）。
     隠すのは applyFilter() の仕事なので、ここでは全部ぶんカードを作ります。 */
  var archives = (SITE.archives || []).filter(function (a) { return videoIdOf(a.url); });
  var grid = el("archiveGrid");
  var empty = el("emptyState");
  var count = el("archiveCount");
  var nodes = [];

  /* 概要欄が3行に収まらず切れているかどうかを見て、切れているものにだけ
     is-clamped を付けます（マウスを載せたときに全文を出すのはそれだけ）。
     切れ方はカードの幅で変わるので、大きさが変わるたびに見直します。
     検索で隠れていたカードも、出てきたときに大きさが変わるので見直されます */
  var clampTargets = [];
  function markClamp(descShort) {
    descShort.parentNode.classList.toggle("is-clamped", descShort.scrollHeight > descShort.clientHeight + 1);
  }
  var clampObserver = window.ResizeObserver
    ? new ResizeObserver(function (list) { list.forEach(function (en) { markClamp(en.target); }); })
    : null;
  function watchClamp(descShort) {
    clampTargets.push(descShort);
    if (clampObserver) clampObserver.observe(descShort);
    else descShort.parentNode.classList.add("is-clamped");   /* 見張れない古いブラウザでは、常に全文を出せるように */
  }
  /* Webフォントが届くと文字幅が変わり、3行に収まるかどうかも変わります */
  if (clampObserver && document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { clampTargets.forEach(markClamp); });
  }

  archives.forEach(function (item) {
    var id = videoIdOf(item.url);

    var li = document.createElement("li");

    var a = document.createElement("a");
    a.className = "card";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    var thumb = document.createElement("div");
    thumb.className = "card__thumb";

    /* 試す順番。maxres は無い配信も多いので順に下げていく。
       item.thumb があればそれを最優先で使う。 */
    var sources = [];
    if (item.thumb) sources.push(item.thumb);
    sources.push(
      "https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg",
      "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg",
      "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg",
      "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"
    );

    var img = document.createElement("img");
    img.alt = item.title || "配信のサムネイル";
    img.loading = "lazy";
    img.decoding = "async";
    /* 一部の環境ではリファラ送出がブロックの原因になるため付けておく */
    img.referrerPolicy = "no-referrer";

    var step = 0;
    var firstYouTube = item.thumb ? 1 : 0;   /* sources のうち YouTube のサムネイルが始まる位置 */
    var tryNext = function () {
      step++;
      if (step < sources.length) {
        img.src = sources[step];
        return;
      }
      /* 全滅したときは動画IDを添えた代替表示に切り替える */
      img.remove();
      var ph = document.createElement("div");
      ph.className = "card__ph";
      var s = document.createElement("span");
      s.textContent = "サムネイルを読み込めませんでした";
      var c = document.createElement("code");
      c.textContent = id;
      ph.appendChild(s);
      ph.appendChild(c);
      thumb.appendChild(ph);
    };
    /* ハンドラは src を入れる前に登録する（取りこぼし防止） */
    img.addEventListener("error", tryNext);
    /* YouTube はその画質のサムネイルが無いとき、404 と一緒に 120×90 の灰色の
       代わり画像（「…」の絵）を返します。ブラウザはこれを読み込めた画像として
       扱い error が起きないので、幅で見分けて次の画質を試します。
       ここで試す画質はどれも幅320以上なので、120以下なら代わり画像です。
       item.thumb の自前の画像は小さくても正しい画像なので見ません */
    img.addEventListener("load", function () {
      if (step >= firstYouTube && img.naturalWidth <= 120) tryNext();
    });
    img.src = sources[0];

    thumb.appendChild(img);
    a.appendChild(thumb);

    var body = document.createElement("div");
    body.className = "card__body";

    var t = document.createElement("p");
    t.className = "card__title";
    t.textContent = item.title || id;
    body.appendChild(t);

    if (item.description) {
      var desc = document.createElement("div");
      desc.className = "card__desc";
      var descShort = document.createElement("p");
      descShort.className = "card__desc-short";
      descShort.textContent = item.description;
      var descFull = document.createElement("p");
      descFull.className = "card__desc-full";
      descFull.setAttribute("aria-hidden", "true");
      descFull.textContent = item.description;
      desc.appendChild(descShort);
      desc.appendChild(descFull);
      body.appendChild(desc);
      watchClamp(descShort);
    }

    /* 日付・長さ・メモ・公開範囲を、ひとつずつタグにして並べます。
       タグの間の空白は、読み上げで項目がつながらないようにするためのものです
       （flex の中なので見た目には出ません） */
    var meta = document.createElement("p");
    meta.className = "card__meta";
    var addTag = function (text, kind) {
      if (!text) return;
      if (meta.firstChild) meta.appendChild(document.createTextNode(" "));
      var tag = document.createElement("span");
      tag.className = "card__tag card__tag--" + kind;
      tag.textContent = text;
      meta.appendChild(tag);
    };
    addTag(fmtDate(item.date), "date");
    addTag(fmtDuration(item.duration), "duration");
    addTag(item.note, "note");
    addTag(availabilityLabel(item.availability), "availability");
    if (meta.firstChild) body.appendChild(meta);

    a.appendChild(body);
    li.appendChild(a);
    grid.appendChild(li);

    nodes.push({ li: li, key: (item.title || "").toLowerCase(), id: id });
  });

  var query = "";

  /* 検索のことばと「いま配信中か」の両方を見て、カードの出し入れと件数を直します */
  function applyFilter() {
    var total = 0;
    var shown = 0;
    nodes.forEach(function (n) {
      if (n.id && n.id === liveId) { n.li.hidden = true; return; }
      total++;
      var hit = !query || n.key.indexOf(query) !== -1;
      n.li.hidden = !hit;
      if (hit) shown++;
    });
    count.textContent = shown === total ? total + "本" : shown + " / " + total + "本";
    empty.hidden = shown !== 0;
  }

  el("finderInput").addEventListener("input", function () {
    query = this.value.trim().toLowerCase();
    applyFilter();
  });

  /* ---- 最初の表示 ---- */
  renderLive(SITE.live);

  /* ---- 配信状況の自動確認 ------------------------------------------------
     /live-now が「いまアルセチカさんが配信中か」を答えます（functions/live-now.js）。
     これがあるので、index.html の live: を書き換え忘れていても、ページのほうが
     自動で追いつきます。

     答えが返らないとき（関数を置いていない・落ちている・判断できない）は
     何もしません。そのときは上の SITE.live に書いてある状態のままです。
     live に pinned: true が付いているときは、人が決めた指定として尊重し、
     自動確認では動かしません（チャンネルの /live に出てこない限定公開の
     配信を手で出しているとき、それを消してしまわないようにするためです）。 */
  var pinned = !!(SITE.live && SITE.live.pinned);

  function checkLiveNow() {
    if (typeof fetch !== "function" || pinned) return;
    fetch("/live-now", { headers: { "accept": "application/json" } })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || data.unknown) return;
        if (data.live && data.id) {
          if (data.id === liveId) {
            updateLiveNote(data.startedAt);
          } else {
            renderLive({ title: data.title, url: data.url, startedAt: data.startedAt });
          }
        } else if (liveId) {
          renderLive(null);
        }
      })
      .catch(function () { /* つながらないときは黙って諦めます */ });
  }

  checkLiveNow();

  /* 開いたままにしている人のぶん。数分おきに見にいきます */
  setInterval(function () {
    if (!document.hidden) checkLiveNow();
  }, 180000);

  /* ---- フッター ---- */
  el("rights").textContent =
    "このサイトで表示しているサムネイル画像・配信タイトル・配信内容など、" +
    SITE.owner + "さんの配信に関する一切の権利は" + SITE.owner + "さんに帰属します。";
  el("disclaimer").textContent =
    "当サイトは有志が個人的にまとめている非公式のリンク集です。" +
    SITE.owner + "さんご本人および関係者とは関係ありません。" +
    "配信アーカイブはいずれも限定公開のため、リンク先の公開状態は" + SITE.owner +
    "さんの設定に従います。掲載の取り下げのご連絡があれば速やかに対応します。";
})();
</script>

</body>
</html>
